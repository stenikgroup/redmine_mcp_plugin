name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Redmine trunk and the stable branches move without a commit here: a core
  # removal has to turn this red on its own.
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Redmine ${{ matrix.redmine }} / Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # Every Ruby each Redmine ref accepts in its Gemfile. Rails is not an
      # axis: each ref pins one exact version (7.2 on 6.1, 8.1 on 7.0 and trunk).
      matrix:
        include:
          # The floor declared by requires_redmine in init.rb.
          - { redmine: '6.1.0', ruby: '3.2' }
          - { redmine: '6.1-stable', ruby: '3.2' }
          - { redmine: '6.1-stable', ruby: '3.3' }
          - { redmine: '6.1-stable', ruby: '3.4' }
          - { redmine: '7.0-stable', ruby: '3.2' }
          - { redmine: '7.0-stable', ruby: '3.3' }
          - { redmine: '7.0-stable', ruby: '3.4' }
          - { redmine: '7.0-stable', ruby: '4.0' }
          # Trunk.
          - { redmine: 'master', ruby: '3.3' }
          - { redmine: 'master', ruby: '3.4' }
          - { redmine: 'master', ruby: '4.0' }

    env:
      RAILS_ENV: test
      BUNDLE_WITHOUT: development

    steps:
      - name: Check out Redmine ${{ matrix.redmine }}
        uses: actions/checkout@v6
        with:
          repository: redmine/redmine
          ref: ${{ matrix.redmine }}

      - name: Check out the plugin
        uses: actions/checkout@v6
        with:
          path: plugins/redmine_mcp_plugin

      # Redmine's Gemfile reads this file to pick the database adapter gem, so
      # it has to exist before Bundler runs.
      - name: Configure the test database
        run: |
          cat > config/database.yml <<EOF
          test:
            adapter: sqlite3
            database: db/redmine_test.sqlite3
          EOF

      # Redmine releases older than the minitest 6 lock (6.1.0) resolve to
      # minitest 6 on a fresh bundle, which the Rails 7.2 test runner cannot drive.
      - name: Hold minitest at 5.x where Redmine does not
        run: grep -q "gem 'minitest'" Gemfile || echo "gem 'minitest', '~> 5.27'" > Gemfile.local

      - name: Install Ruby ${{ matrix.ruby }} and the gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Migrate
        run: bin/rails db:migrate redmine:plugins:migrate

      - name: Run the plugin tests
        run: bin/rails redmine:plugins:test NAME=redmine_mcp_plugin

  # RuboCop and line coverage, on one Redmine: both come from that Redmine's
  # own Gemfile, and neither says more when repeated across the matrix.
  quality:
    name: Lint and coverage
    runs-on: ubuntu-latest

    env:
      RAILS_ENV: test
      BUNDLE_WITHOUT: development
      # Below this the build fails. What is left out is a few rescues of
      # failures that cannot be provoked; redmine_checklists and
      # redmineup_tags, which cannot be installed here, run over stand-ins.
      MINIMUM_COVERAGE: 98

    steps:
      - name: Check out Redmine 7.0-stable
        uses: actions/checkout@v6
        with:
          repository: redmine/redmine
          ref: 7.0-stable

      - name: Check out the plugin
        uses: actions/checkout@v6
        with:
          path: plugins/redmine_mcp_plugin

      - name: Configure the test database
        run: |
          cat > config/database.yml <<EOF
          test:
            adapter: sqlite3
            database: db/redmine_test.sqlite3
          EOF

      - name: Hold minitest at 5.x where Redmine does not
        run: grep -q "gem 'minitest'" Gemfile || echo "gem 'minitest', '~> 5.27'" > Gemfile.local

      - name: Install Ruby 3.3 and the gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # The configuration and the paths are named: Redmine's root configuration
      # excludes plugins/, and a bare run would inspect nothing and pass.
      - name: RuboCop
        working-directory: plugins/redmine_mcp_plugin
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/Gemfile
        run: bundle exec rubocop -c .rubocop.yml app config lib test init.rb

      - name: Migrate
        run: bin/rails db:migrate redmine:plugins:migrate

      - name: Run the plugin tests with coverage
        env:
          COVERAGE: '1'
        run: bin/rails redmine:plugins:test NAME=redmine_mcp_plugin

      - name: Line coverage of the plugin
        run: ruby plugins/redmine_mcp_plugin/test/coverage.rb "$MINIMUM_COVERAGE"

  # The tools that reach into another plugin, over the plugin itself where it
  # can be installed: additional_tags, with the additionals it needs, which run
  # on PostgreSQL or MySQL only. Elsewhere they run over stand-ins. Not part of
  # the gate below: a release of someone else's plugin must not block a merge.
  plugins:
    name: Third-party plugins
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: redmine
          POSTGRES_PASSWORD: redmine
          POSTGRES_DB: redmine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U redmine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      RAILS_ENV: test
      BUNDLE_WITHOUT: development

    steps:
      - name: Check out Redmine 7.0-stable
        uses: actions/checkout@v6
        with:
          repository: redmine/redmine
          ref: 7.0-stable

      - name: Check out the plugin
        uses: actions/checkout@v6
        with:
          path: plugins/redmine_mcp_plugin

      - name: Check out additionals
        uses: actions/checkout@v6
        with:
          repository: alphanodes/additionals
          path: plugins/additionals

      - name: Check out additional_tags
        uses: actions/checkout@v6
        with:
          repository: alphanodes/additional_tags
          path: plugins/additional_tags

      - name: Configure the test database
        run: |
          cat > config/database.yml <<EOF
          test:
            adapter: postgresql
            host: localhost
            database: redmine_test
            username: redmine
            password: redmine
            encoding: utf8
          EOF

      - name: Hold minitest at 5.x where Redmine does not
        run: grep -q "gem 'minitest'" Gemfile || echo "gem 'minitest', '~> 5.27'" > Gemfile.local

      - name: Install Ruby 3.4 and the gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Migrate
        run: bin/rails db:migrate redmine:plugins:migrate

      - name: Run the integration tests over the real additional_tags
        run: >-
          bin/rails test
          plugins/redmine_mcp_plugin/test/functional/mcp_plugin_integrations_test.rb
          plugins/redmine_mcp_plugin/test/unit/integrations_test.rb

  # The one check main requires: branch protection names this job instead of
  # the jobs above, so they can change without touching the settings.
  passed:
    name: Tests passed
    if: always()
    needs: [test, quality]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        run: test "${{ needs.test.result }}" = "success" && test "${{ needs.quality.result }}" = "success"
